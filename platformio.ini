; PlatformIO Project Configuration File
;
; Projeto Buzzline - seguidor de linha com a RoboCore BlackBoard Rocky
;
; A Rocky usa um ESP32 comum (no Arduino IDE: "ESP32 Dev Module").
; A biblioteca RoboCore_Rocky exige o pacote Arduino-ESP32 v3.x, por isso
; usamos a plataforma "pioarduino" em vez da "espressif32" padrao
; (a padrao do PlatformIO ainda vem com o core 2.x e nao compila).

[env:rocky]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino

; Biblioteca oficial da Rocky (motores, LED e bateria)
lib_deps =
    https://github.com/RoboCore/RoboCore_Rocky.git

monitor_speed = 115200
upload_speed = 115200